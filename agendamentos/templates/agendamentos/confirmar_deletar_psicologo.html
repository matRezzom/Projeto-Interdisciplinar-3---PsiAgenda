<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PsiAgenda - Excluir Psicólogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f8f9fa; } .navbar-custom { background-color: #4a90e2; } </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 mb-4">
    <a class="navbar-brand fw-bold" href="{% url 'painel_secretaria' %}">PsiAgenda</a>
</nav>

<div class="container mb-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm p-4 text-center">
        <h3 class="text-danger fw-bold mb-3">Excluir Psicólogo</h3>
        <p class="fs-5 mb-3">Tem certeza de que deseja excluir o(a) psicólogo(a) <strong>{{ psicologo.nome_completo }}</strong>?</p>
        <p class="text-muted small mb-4">Esta ação apagar o cadastro e o acesso do profissional do sistema permanentemente.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'listar_psicologos' %}" class="btn btn-outline-secondary w-50 fw-bold">Cancelar</a>
                <button type="submit" class="btn btn-danger w-50 fw-bold">Confirmar Exclusão</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
