<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PsiAgenda - Solicitar Cancelamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 550px;">
    <div class="card border-0 shadow-sm p-4">
        <h4 class="text-warning text-dark fw-bold mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Solicitar Cancelamento
        </h4>
        <p class="text-muted small mb-3">
            Esta solicitação será enviada para o painel da secretária para que ela cancele a consulta no sistema e entre em contato com o paciente.
        </p>
        
        <div class="bg-light p-3 rounded mb-3 border">
            <p class="mb-1"><strong>Paciente:</strong> {{ agendamento.paciente.nome_completo }}</p>
            <p class="mb-0"><strong>Data/Hora:</strong> {{ agendamento.data_hora|date:"d/m/Y às H:i" }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="motivo" class="form-label fw-semibold">Motivo do Cancelamento:</label>
                <textarea name="motivo" id="motivo" class="form-control" rows="3" placeholder="Informe o motivo para a secretária..." required></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'painel_psicologo' %}" class="btn btn-outline-secondary fw-bold">Voltar</a>
                <button type="submit" class="btn btn-warning fw-bold">Enviar para Secretária</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
