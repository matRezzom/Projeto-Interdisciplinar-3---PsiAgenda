<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsiAgenda - Atenção</title>
    <!-- Fontes do Google (Lora e Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f5f3;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .notice-container {
            width: 100%;
            max-width: 480px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #1a3328;
            text-decoration: none;
            margin-bottom: 1.75rem;
        }

        .brand-logo .logo-icon {
            background-color: #1a3328;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem;
            color: #ffffff;
        }

        .card-custom {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background-color: #fef3c7;
            color: #d97706;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem auto;
        }

        .notice-title {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.75rem;
        }

        .notice-message {
            color: #4b5563;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .btn-logout {
            background-color: #1a3328;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-logout:hover {
            background-color: #2a4c3d;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="notice-container">
    <!-- LOGO DA MARCA -->
    <div class="brand-logo">
        <div class="logo-icon">Ψ</div>
        <span>PsiAgenda</span>
    </div>

    <!-- CARD DE AVISO -->
    <div class="card-custom text-center">
        <div class="icon-circle">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h2 class="notice-title">Aviso de Perfil</h2>
        
        <p class="notice-message">
            {{ mensagem }}
        </p>

        <a href="{% url 'logout' %}" class="btn-logout">
            <i class="bi bi-box-arrow-right"></i> Voltar e Sair
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
