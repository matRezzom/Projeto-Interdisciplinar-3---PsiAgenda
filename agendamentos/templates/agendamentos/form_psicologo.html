<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PsiAgenda - Editar Psicólogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background-color: #f8f9fa; } .navbar-custom { background-color: #4a90e2; } </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 mb-4">
    <a class="navbar-brand fw-bold" href="{% url 'painel_secretaria' %}">PsiAgenda</a>
</nav>

<div class="container mb-5" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0">Editar Psicólogo</h2>
        <a href="{% url 'listar_psicologos' %}" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>

    <div class="card border-0 shadow-sm p-4">
        <form method="POST">
            {% csrf_token %}
            <h5 class="text-primary fw-bold mb-3">Dados Pessoais e Profissionais</h5>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nome Completo</label>
                {{ form.nome_completo }}
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">CRP</label>
                    {{ form.crp }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">CPF</label>
                    {{ form.cpf }}
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Data de Nascimento</label>
                    {{ form.data_nascimento }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Telefone</label>
                    {{ form.telefone }}
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">E-mail</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Endereço</label>
                {{ form.endereco }}
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold mt-3">Salvar Alterações</button>
        </form>
    </div>
</div>
</body>
</html>
